name: Publish Docker image

on:
  workflow_call:
    inputs:
      tag:
        description: Existing Git tag to publish
        required: true
        type: string
      ref:
        description: Commit created by Release Please
        required: false
        default: ''
        type: string
      publish_latest:
        description: Also update the latest image tag
        required: false
        default: true
        type: boolean
    secrets:
      DOCKERHUB_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable Git tag, for example 1.1.0
        required: true
        type: string
      publish_latest:
        description: Also update the latest image tag
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: docker-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY || 'wungjyan/framefolio' }}
      NPM_REGISTRY: ${{ vars.NPM_REGISTRY || 'https://registry.npmjs.org' }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Check out release source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || inputs.tag }}

      - name: Verify release tag and source
        id: release
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable semantic version such as 1.1.0, got: $RELEASE_TAG" >&2
            exit 1
          fi

          git fetch --force --tags origin
          tag_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          source_sha="$(git rev-parse HEAD)"

          if [[ -z "$tag_sha" || "$source_sha" != "$tag_sha" ]]; then
            echo "The checked-out source does not match Git tag $RELEASE_TAG." >&2
            exit 1
          fi

          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: Sign in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || 'wungjyan' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_REPOSITORY }}
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=raw,value=latest,enable=${{ inputs.publish_latest }}
          labels: |
            org.opencontainers.image.title=Framefolio
            org.opencontainers.image.description=Self-hosted photo portfolio with web administration and S3-compatible storage
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.tag }}
            org.opencontainers.image.revision=${{ steps.release.outputs.sha }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            NPM_REGISTRY=${{ env.NPM_REGISTRY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Write publication summary
        shell: bash
        run: |
          {
            echo "## Docker image published"
            echo
            echo "- Image: \`$IMAGE_REPOSITORY:$RELEASE_TAG\`"
            if [[ "${{ inputs.publish_latest }}" == "true" ]]; then
              echo "- Alias: \`$IMAGE_REPOSITORY:latest\`"
            fi
            echo "- Source: \`${{ steps.release.outputs.sha }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
